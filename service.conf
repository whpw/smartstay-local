[Unit]
Description=SmartStay.app Service
After=network.target

[Service]
Type=simple
User=smartstay
WorkingDirectory=/home/smartstay/smartstay-local
Environment=NODE_ENV=production
# Only kill the main PID so a detached OTA apply-update.sh can finish.
# start.sh must `exec` Node so Node is the main PID (frees :8080 on stop).
KillMode=process
KillSignal=SIGTERM
TimeoutStopSec=20
# Clear a leftover listener from older start.sh (bash main + Node child) layouts.
ExecStartPre=-/bin/bash -c '/usr/bin/fuser -k 8080/tcp >/dev/null 2>&1 || true; sleep 1'
ExecStart=/home/smartstay/smartstay-local/start.sh
Restart=on-failure
RestartSec=10

[Install]
WantedBy=multi-user.target
