[Unit]
Description=SmartStay.app Service
After=network.target

[Service]
Type=simple
User=smartstay
WorkingDirectory=/home/smartstay/client-smartstay-app
Environment=NODE_VERSION=production
ExecStart=/home/smartstay/client-smartstay-app/start.sh
Restart=on-failure
RestartSec=10

[Install]
WantedBy=multi-user.target
