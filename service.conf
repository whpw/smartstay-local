[Unit]
Description=SmartStay.app Service
After=network.target

[Service]
Type=simple
User=smartstay
WorkingDirectory=/home/smartstay/smartstay-local
Environment=NODE_ENV=production
# Only kill the main PID so a detached OTA apply-update.sh can finish.
# start.sh must `exec` Node so Node is the main PID (frees :8080 on stop).
KillMode=process
ExecStart=/home/smartstay/smartstay-local/start.sh
KillSignal=SIGTERM
TimeoutStopSec=20
# If anything is still holding the port after stop, fail clearly on next start.
ExecStartPre=-/bin/bash -c 'if ss -ltn | grep -q ":8080 "; then echo "port 8080 still in use"; ss -ltnp | grep 8080 || true; exit 1; fi'

[Install]
WantedBy=multi-user.target
